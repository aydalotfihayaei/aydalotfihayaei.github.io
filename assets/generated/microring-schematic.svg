<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
<title id="t">SOI add-drop microring resonator schematic</title>
<desc id="d">A clean schematic of the selected simulated SOI add-drop microring with ring centerline radius 10 micrometers and physical ring-to-bus gap 200 nanometers. The drawing is explicitly not to scale.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#031229"/><stop offset="1" stop-color="#0b2b56"/></linearGradient>
 <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0ac6ff"/><stop offset=".5" stop-color="#9be7ff"/><stop offset="1" stop-color="#5177ff"/></linearGradient>
 <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12d9ff"/><stop offset=".5" stop-color="#5f83ff"/><stop offset=".72" stop-color="#ff8c39"/><stop offset="1" stop-color="#ffd56a"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="760" height="420" rx="28" fill="url(#bg)"/>
<g opacity=".28" stroke="#4bb6ff" stroke-width="1"><path d="M0 80H760M0 160H760M0 240H760M0 320H760"/><path d="M120 0V420M240 0V420M360 0V420M480 0V420M600 0V420"/></g>
<g filter="url(#glow)" fill="none" stroke-linecap="round"><path d="M42 95H718" stroke="url(#wg)" stroke-width="16"/><path d="M42 325H718" stroke="url(#wg)" stroke-width="16"/><circle cx="380" cy="210" r="104" stroke="url(#ring)" stroke-width="17"/></g>
<g fill="#d9efff" font-family="Inter,Segoe UI,sans-serif"><text x="44" y="42" font-size="18" font-weight="750">SOI add-drop microring</text><text x="44" y="65" font-size="12" fill="#9bcdf4">Selected simulation: R = 10 µm · gap = 200 nm</text><text x="44" y="392" font-size="11" fill="#79a9cf">Schematic — not to scale</text></g>
<g fill="#bfe8ff" font-family="Inter,Segoe UI,sans-serif" font-size="11"><text x="44" y="86">Input</text><text x="680" y="86">Through</text><text x="44" y="350">Add</text><text x="690" y="350">Drop</text></g>
</svg>